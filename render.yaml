# ============================================================================
# Build Flow BPO — Render Blueprint (deploy em um clique)
# Uso: no Render -> New -> Blueprint -> conectar o repositório GitHub.
# Ajustes manuais após criar: DATABASE_URL e ADMIN_PASSWORD (sync: false).
# ============================================================================
services:
  - type: web
    name: build-flow-bpo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SESSION_EXPIRE_MINUTES
        value: 720
      - key: PASSWORD_HASH_ALGORITHM
        value: argon2id
      # Gera um SECRET_KEY aleatório automaticamente no primeiro deploy
      - key: SECRET_KEY
        generateValue: true
      # Preenchidos manualmente no painel (nunca no repositório):
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
