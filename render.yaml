# ============================================================================
# Build Flow BPO — Render Blueprint (deploy em um clique)
# Uso: no Render -> New -> Blueprint -> conectar o repositório GitHub.
# Ajustes manuais após criar: DATABASE_URL e ADMIN_PASSWORD (sync: false).
# ============================================================================
services:
  - type: web
    name: build-flow-bpo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # IMPORTANTE: fixa o Python 3.12 — o padrão 3.14 do Render não possui
      # binários pré-compilados para psycopg2-binary e pydantic-core
      # (o build a partir do código-fonte falha no ambiente do Render).
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SESSION_EXPIRE_MINUTES
        value: 720
      - key: PASSWORD_HASH_ALGORITHM
        value: argon2id
      # Demonstração: no 1º boot cria o admin (ADMIN_PASSWORD) e popula dados
      # fictícios automaticamente — sem precisar do Shell (que é pago).
      # Em produção, mude para false e remova as credenciais abaixo.
      - key: SEED_DEMO_ON_STARTUP
        value: true
      # Cria as tabelas automaticamente no 1º boot se o banco estiver vazio
      # (permite usar o Render Postgres free ou qualquer Postgres sem SQL Editor).
      - key: SETUP_SCHEMA_ON_STARTUP
        value: true
      # Dados estendidos para apresentação: gera dezenas de escritórios,
      # projetos, contratos e movimentação financeira (demo_generate.sql).
      - key: DEMO_EXTENDED
        value: true
      # Limpeza automática dos dados de demonstração no boot (use com cuidado):
      # coloque true, faça o deploy, e volte para false após limpar.
      - key: DEMO_CLEAN_ON_STARTUP
        value: false
      # Gera um SECRET_KEY aleatório automaticamente no primeiro deploy
      - key: SECRET_KEY
        generateValue: true
      # Preenchidos manualmente no painel (nunca no repositório):
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
